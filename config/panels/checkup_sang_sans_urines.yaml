# Panel « sang seul, sans urines » : modele dedie de Q3 allegee (piste suivi, DECISIONS.md) ;
# identique a checkup_sang_seul, ACR hors modele.
#
# Panel « sang seul » : variante du panel standard SANS mesures physiques (tension, pouls,
# IMC, tour de taille), pour un produit qui ne les mesure pas. Memes transformations et memes
# hyperparametres que checkup_standard (DECISIONS.md, piste suivi, etape 0). Urines (ACR) gardees.
#
# Panel « check-up de prevention standard » (description d'origine ci-dessous).
#
# Decrit ce que la cohorte cible mesure, independamment de la source.
# Les unites sont les unites canoniques attendues en entree du score ;
# alt_units donne le facteur multiplicatif vers l'unite canonique.
#
# Champs par variable :
#   unit       unite canonique
#   system     systeme physiologique (age biologique par systeme)
#   in_model   false = variable collectee mais non utilisee par le modele
#   range      plage plausible [min, max] ; hors plage -> valeur manquante
#   floor      plancher applique avant transformation (ex. limite de detection)
#   log        true = transformation logarithmique
#   spline     nombre de noeuds d'une spline cubique restreinte (absent = lineaire)
name: checkup_sang_sans_urines
description: Bilan de suivi sans mesures physiques ni urines (biologie sanguine seule)
version: 1
include_sex: true

systems:
  cardiovasculaire: Lipides
  metabolique: Glycemie, HbA1c
  renal: Fonction renale
  hepatique: Enzymes hepatiques et albumine
  inflammatoire_hematologique: CRP et numeration sanguine

variables:
  # --- Cardiovasculaire
  sbp:        {unit: mmHg, system: cardiovasculaire, range: [70, 260], spline: 4, in_model: false}
  dbp:        {unit: mmHg, system: cardiovasculaire, range: [30, 150], spline: 4, in_model: false}
  total_chol: {unit: mmol/L, system: cardiovasculaire, range: [1.5, 15], spline: 4,
               alt_units: {mg/dL: 0.02586, g/L: 2.586}}
  hdl:        {unit: mmol/L, system: cardiovasculaire, range: [0.2, 5], log: true, spline: 4,
               alt_units: {mg/dL: 0.02586, g/L: 2.586}}
  tg:         {unit: mmol/L, system: cardiovasculaire, range: [0.2, 30], log: true,
               alt_units: {mg/dL: 0.01129, g/L: 1.129}}
  ldl:        {unit: mmol/L, system: cardiovasculaire, range: [0.3, 12], in_model: false,
               alt_units: {mg/dL: 0.02586, g/L: 2.586}}
  # Point 3 (CV sur le developpement, DECISIONS.md 3) : FC retenue (spline : test de
  # linearite) ; traitements testes et non retenus, conserves comme variables facultatives.
  heart_rate:    {unit: bpm, system: cardiovasculaire, range: [30, 200], spline: 4, in_model: false}
  htn_treated:   {unit: "0/1", system: cardiovasculaire, range: [0, 1], in_model: false}   # traitement antihypertenseur declare
  lipid_treated: {unit: "0/1", system: cardiovasculaire, range: [0, 1], in_model: false}   # traitement hypolipemiant declare
  # Fichier des medicaments NHANES : analyse de sensibilite uniquement, jamais dans le modele
  rx_antihypertensive: {unit: "0/1", system: cardiovasculaire, range: [0, 1], in_model: false}
  rx_statin:           {unit: "0/1", system: cardiovasculaire, range: [0, 1], in_model: false}

  # --- Metabolique
  glucose:    {unit: mmol/L, system: metabolique, range: [2, 35], log: true,
               alt_units: {mg/dL: 0.05551, g/L: 5.551}}
  hba1c:      {unit: "%", system: metabolique, range: [3, 18],
               alt_units: {mmol/mol: [0.09148, 2.152]}}   # [pente, ordonnee] IFCC -> NGSP
  bmi:        {unit: kg/m2, system: metabolique, range: [13, 80], spline: 4, in_model: false}
  waist:      {unit: cm, system: metabolique, range: [50, 200], in_model: false}

  # --- Renal
  creatinine: {unit: umol/L, system: renal, range: [20, 1500], log: true, spline: 4,
               alt_units: {mg/dL: 88.42, mg/L: 8.842}}
  # ACR ajoute au jalon 2 par CV sur le developpement ; uree testee et ecartee
  # (deviation documentee, DECISIONS.md 2.1) : conservee comme variable facultative.
  acr:        {unit: mg/mmol, system: renal, range: [0, 500], floor: 0.1, log: true, in_model: false,
               alt_units: {mg/g: 0.1131}}
  urea:       {unit: mmol/L, system: renal, range: [0.5, 60], log: true, in_model: false,
               alt_units: {mg/dL BUN: 0.357, g/L: 16.65}}

  # --- Hepatique
  alt:        {unit: U/L, system: hepatique, range: [3, 2000], log: true, spline: 4}
  ast:        {unit: U/L, system: hepatique, range: [3, 2000], log: true}
  ggt:        {unit: U/L, system: hepatique, range: [3, 3000], log: true}
  alp:        {unit: U/L, system: hepatique, range: [10, 1500], log: true}
  albumin:    {unit: g/L, system: hepatique, range: [15, 60], alt_units: {g/dL: 10}}

  # --- Inflammatoire / hematologique
  crp:        {unit: mg/L, system: inflammatoire_hematologique, range: [0, 300], log: true,
               floor: 0.1,      # limite de detection du dosage standard ; harmonise CRP et hs-CRP
               alt_units: {mg/dL: 10}}
  wbc:        {unit: 10^9/L, system: inflammatoire_hematologique, range: [1, 50], log: true}
  lymph_pct:  {unit: "%", system: inflammatoire_hematologique, range: [2, 90]}
  rdw:        {unit: "%", system: inflammatoire_hematologique, range: [9, 30]}
  mcv:        {unit: fL, system: inflammatoire_hematologique, range: [55, 130]}
  hb:         {unit: g/dL, system: inflammatoire_hematologique, range: [6, 20], spline: 4,
               alt_units: {g/L: 0.1, mmol/L: 1.611}}
  platelets:  {unit: 10^9/L, system: inflammatoire_hematologique, range: [20, 1000], log: true, spline: 4}
